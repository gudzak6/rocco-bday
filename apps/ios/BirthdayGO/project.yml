name: BirthdayGO
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    BG_API_BASE_URL: "https://ookqnalokcpqvdojmcmy.supabase.co/functions/v1/"
    BG_SUPABASE_ANON_KEY: "sb_publishable_DEnBR0L7_tN5veEl9nMGNA_5zsIZVI6"
  configs:
    Release:
      BG_API_BASE_URL: "https://ookqnalokcpqvdojmcmy.supabase.co/functions/v1/"
      BG_SUPABASE_ANON_KEY: "sb_publishable_DEnBR0L7_tN5veEl9nMGNA_5zsIZVI6"
targets:
  BirthdayGO:
    type: application
    platform: iOS
    sources: [BirthdayGO]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BirthdayGO
        INFOPLIST_FILE: BirthdayGO/Info.plist
        GENERATE_INFOPLIST_FILE: false
        MARKETING_VERSION: "1.0"
