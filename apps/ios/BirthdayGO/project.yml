        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: false
    scheme:
      testTargets: [BirthdayGOTests, BirthdayGOUITests]
  BirthdayGOTests:
    type: bundle.unit-test
    platform: iOS
    sources: [BirthdayGOTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BirthdayGOTests
    dependencies:
      - target: BirthdayGO
  BirthdayGOUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [BirthdayGOUITests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.example.BirthdayGOUITests
    dependencies:
      - target: BirthdayGO
